name: Build ArabToonz Aniyomi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to build
        required: true
        default: arabtoonz-aniyomi
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed ArabToonz APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ARABTOONZ_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf "%s" "$KEYSTORE_B64" | base64 --decode > signingkey.jks

      - name: Assemble ArabToonz APK
        env:
          ALIAS: ${{ secrets.ARABTOONZ_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ARABTOONZ_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ARABTOONZ_KEY_PASSWORD }}
        run: |
          ./gradlew :src:ar:arabtoonz:assembleRelease --stacktrace
          apk=$(find src/ar/arabtoonz/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$apk"
          mkdir -p src/ar/arabtoonz/build/outputs/apk/signed
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" sign \
            --ks signingkey.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out src/ar/arabtoonz/build/outputs/apk/signed/arabtoonz-aniyomi.apk "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs src/ar/arabtoonz/build/outputs/apk/signed/arabtoonz-aniyomi.apk

      - name: Upload signed APK and source metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arabtoonz-aniyomi-apk
          path: |
            src/ar/arabtoonz/build/outputs/apk/signed/*.apk
            src/ar/arabtoonz/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 30
