name: Build E-Hentai extension

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to build
        required: true
        default: ehentai-extension
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build E-Hentai debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Assemble E-Hentai APK
        run: ./gradlew src:en:ehentai:assembleDebug --stacktrace

      - name: Upload E-Hentai APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aniyomi-en-ehentai-debug-apk
          path: src/en/ehentai/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
